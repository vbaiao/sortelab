name: Atualizar resultados das loterias

on:
  schedule:
    # Duas vezes por hora, em minutos "quebrados" de propósito: o GitHub
    # enfileira os agendamentos de todo mundo e costuma atrasar ou descartar
    # execuções nos minutos redondos (:00 e :30), que são os mais disputados.
    # Duas tentativas por hora também cobrem a hora do sorteio mesmo que uma
    # delas seja descartada.
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo site do GitHub

permissions:
  contents: write

concurrency:
  group: atualizar-resultados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar concursos novos na API da Caixa
        run: python robo/atualizar.py

      - name: Publicar se houver novidade
        run: |
          if git diff --quiet dados/; then
            echo "Nada novo hoje."
          else
            git config user.name "Robô SorteLab"
            git config user.email "actions@github.com"
            git add dados/
            git commit -m "Resultados atualizados automaticamente"
            git push
          fi
