name: Atualizar resultados das loterias

on:
  schedule:
    # O GitHub enfileira os agendamentos de todos os repositórios e descarta
    # boa parte deles: medimos 6 execuções de 48 tentativas em um dia. Por
    # isso duas estratégias juntas — tentativas espaçadas o dia todo e uma
    # rajada na janela dos sorteios (20h às 23h de Brasília = 23h às 2h UTC),
    # quando é crítico capturar o resultado novo.
    # Mesmo assim o site nunca fica desatualizado para o visitante: a página
    # consulta a API da Caixa por conta própria (ver js/app.js).
    - cron: "7,37 * * * *"
    - cron: "*/10 23,0,1,2 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo site do GitHub

permissions:
  contents: write

# Sem trava de concorrência de propósito. Com ela, o GitHub só guarda UMA
# execução na fila por vez e cancela a anterior quando chega outra — o que
# gerava avisos de "job cancelado" sempre que ele liberava várias execuções
# atrasadas de uma vez. Duas execuções simultâneas aqui são inofensivas: a
# segunda simplesmente não encontra novidade, ou perde a corrida do push e
# encerra em paz (veja o passo de publicação).

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar concursos novos na API da Caixa
        run: python robo/atualizar.py

      - name: Publicar se houver novidade
        run: |
          if git diff --quiet dados/; then
            echo "Nada novo: o histórico já estava em dia."
            exit 0
          fi
          git config user.name "Robô SorteLabs"
          git config user.email "actions@github.com"
          git add dados/
          git commit -m "Resultados atualizados automaticamente"
          if git push; then
            echo "Publicado."
          else
            echo "Outra execução publicou primeiro. Nada a fazer: os dados já"
            echo "estão no site e a próxima rodada confere de novo."
          fi
