name: Atualizar resultados das loterias

on:
  schedule:
    # De hora em hora, no minuto 30 (horário UTC). Quando não há concurso
    # novo, o robô só confere e encerra — não custa nada.
    - cron: "30 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo site do GitHub

permissions:
  contents: write

concurrency:
  group: atualizar-resultados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar concursos novos na API da Caixa
        run: python robo/atualizar.py

      - name: Publicar se houver novidade
        run: |
          if git diff --quiet dados/; then
            echo "Nada novo hoje."
          else
            git config user.name "Robô SorteLab"
            git config user.email "actions@github.com"
            git add dados/
            git commit -m "Resultados atualizados automaticamente"
            git push
          fi
