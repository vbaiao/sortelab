<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>SorteLab — teste do motor JS</title>
<style>body{font-family:monospace;padding:20px} .ok{color:green} .erro{color:red}</style>
</head>
<body>
<h1>Teste do motor JS contra o gabarito Python</h1>
<div id="saida">Rodando…</div>
<script src="js/motor.js"></script>
<script src="js/fechamento.js"></script>
<script>
"use strict";
const SL = window.SorteLab;
const saida = document.getElementById("saida");
const linhas = [];

function log(ok, texto) {
  linhas.push('<div class="' + (ok ? "ok" : "erro") + '">' +
    (ok ? "OK  " : "ERRO ") + texto + "</div>");
}

fetch("dados/gabarito_teste.json").then(r => r.json()).then(async gabarito => {
  for (const slug of Object.keys(gabarito)) {
    const cfg = SL.LOTERIAS[slug];
    const esperado = gabarito[slug];
    const base = await fetch("dados/" + slug + ".json").then(r => r.json());
    const stats = SL.calcularEstatisticas(cfg, base.concursos);

    log(stats.total === esperado.total,
        cfg.nome + " total concursos: " + stats.total + " (esperado " + esperado.total + ")");

    const campeao = SL.jogoCampeao(cfg, stats);
    const bate = JSON.stringify(campeao) === JSON.stringify(esperado.campeao);
    log(bate, cfg.nome + " campeão: " + campeao.join("-") +
        (bate ? "" : " ≠ " + esperado.campeao.join("-")));

    const custo = SL.custoAposta(cfg, cfg.apostaMin);
    log(Math.abs(custo - esperado.custo_minimo) < 0.001,
        cfg.nome + " custo mínimo: " + custo);

    const chance = SL.chanceUmEm(cfg, cfg.apostaMin, 1);
    log(chance === esperado.chance_um_em,
        cfg.nome + " chance 1 em: " + chance + " (esperado " + esperado.chance_um_em + ")");

    // geração: 5 jogos válidos e distintos
    const jogos = SL.gerarJogos(cfg, stats, 3, cfg.apostaMin);
    const validos = jogos.every(j => SL.jogoValido(cfg, j) &&
                                     j.length === cfg.apostaMin);
    log(validos, cfg.nome + " geração: 3 jogos válidos");

    // conferidor: o último resultado contra ele mesmo = prêmio máximo
    const ultimo = base.concursos[base.concursos.length - 1][2];
    if (ultimo.length >= cfg.apostaMin) {
      const conf = SL.conferirJogos(cfg, ultimo, [ultimo.slice(0, cfg.apostaMin)]);
      log(conf[0].acertos.length > 0, cfg.nome + " conferidor: " +
          conf[0].acertos.length + " acertos no auto-teste");
    }
  }

  const FZ = window.SorteLabFechamento;
  const gf = await fetch("dados/gabarito_fechamento.json").then(r => r.json());
  const dezenas = [2,3,5,6,9,10,11,13,14,15,16,19,20,21,22,23,24,25];
  const resultado = [1,2,3,5,6,9,10,11,13,14,15,16,19,20,24];
  const rateio = {11:7.0, 12:14.0, 13:35.0, 14:1341.42, 15:565758.41};

  for (const pid of Object.keys(gf.padroes)) {
    const esperado = gf.padroes[pid];
    const jogos = FZ.montar(dezenas.slice(0, FZ.PADROES[pid].dezenas), pid);
    log(JSON.stringify(jogos) === JSON.stringify(esperado.jogos),
        "fechamento " + pid + ": montagem bate com o Python");
    log(Math.abs(FZ.custoDoPadrao(pid) - esperado.custo) < 0.001,
        "fechamento " + pid + ": custo R$ " + FZ.custoDoPadrao(pid));
    const nota = FZ.avaliar(jogos, resultado, rateio);
    log(JSON.stringify(nota.acertos) === JSON.stringify(esperado.avaliacao.acertos),
        "fechamento " + pid + ": acertos batem com o Python");
    log(Math.abs(nota.retorno - esperado.avaliacao.retorno) < 0.001,
        "fechamento " + pid + ": retorno R$ " + nota.retorno);
  }

  for (const semente of Object.keys(gf.sorteios)) {
    const saiu = FZ.dezenasAleatorias(Number(semente), 18, 1, 25);
    log(JSON.stringify(saiu) === JSON.stringify(gf.sorteios[semente]),
        "sorteio semente " + semente + ": bate com o Python");
  }

  const erros = linhas.filter(l => l.includes("erro")).length;
  linhas.unshift("<h2>" + (erros ? erros + " ERRO(S)" : "TUDO OK ✔") + "</h2>");
  saida.innerHTML = linhas.join("");
  document.title = (erros ? "ERROS " + erros : "TUDO OK") + " — teste SorteLab";
}).catch(e => { saida.textContent = "Falha ao rodar: " + e; });
</script>
</body>
</html>
